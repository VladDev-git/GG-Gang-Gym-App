name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM, Android, server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Build and test
        run: >
          ./gradlew
          :core:jvmTest
          :data:compileKotlinJvm
          :app:desktopApp:compileKotlin
          :app:androidApp:assembleDebug
          :server:build
          --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: '**/build/reports/tests/**'

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Compile iOS targets
        run: >
          ./gradlew
          :core:compileKotlinIosSimulatorArm64
          :data:compileKotlinIosSimulatorArm64
          :app:shared:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

      - name: Run iOS tests
        run: ./gradlew :core:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ios
          path: '**/build/reports/tests/**'
